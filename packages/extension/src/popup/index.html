<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shareworks Bridge</title>
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 14px;
      font-weight: 600;
      color: #38bdf8;
    }
    .card {
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .status-badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
    }
    .status-badge.active { background: #22c55e; }
    .status-badge.warning { background: #f59e0b; }
    button {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: #0284c7;
      color: white;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="status-badge active" id="bridge-badge"></span>
    <span class="title">Shareworks Bridge</span>
  </div>
  <div class="card">
    <div class="status-row">
      <span>Portal Tab:</span>
      <span id="tab-status" style="font-weight: 600; color: #94a3b8;">Checking...</span>
    </div>
    <div class="status-row">
      <span>Auth State:</span>
      <span id="auth-status" style="font-weight: 600; color: #94a3b8;">Unknown</span>
    </div>
  </div>
  <button id="sync-btn">Sync Portfolio Now</button>
  <script type="module" src="./popup.ts"></script>
</body>
</html>
