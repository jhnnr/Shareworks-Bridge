name: Deploy Dashboard & Release Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-and-release'
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Run test suites
        run: npm run test

      - name: Build web dashboard and companion extension
        run: npm run build

      - name: Extract version from root package.json
        id: pkg-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Target release version from package.json: v${VERSION}"

      - name: Package extension artifact into ZIP
        run: |
          VERSION="${{ steps.pkg-version.outputs.version }}"
          cd packages/extension/dist
          zip -r "../../../shareworks-bridge-extension-v${VERSION}.zip" .
          cd ../../..

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Upload extension ZIP artifact for workflow
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: shareworks-bridge-extension-v*.zip

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release-extension:
    name: Publish Extension Release
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download extension ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-zip

      - name: Publish GitHub Release with Git Compare Notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-and-test.outputs.version }}
          name: Shareworks Bridge v${{ needs.build-and-test.outputs.version }}
          generate_release_notes: true
          files: shareworks-bridge-extension-v${{ needs.build-and-test.outputs.version }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
